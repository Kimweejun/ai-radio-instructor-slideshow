<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 무전 교관 발표</title>
<link rel="icon" href="assets/logo_dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.8.184/dist/hyperframes-player.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.8.184/dist/slideshow/hyperframes-slideshow.global.js"></script>
<style>
:root{
  --paper:#ECEEE8; --ink:#1D2A24; --muted:#5C6860; --olive:#4E5D3C; --olive-ink:#F1F3EC; --signal:#F2A900;
  --field:#EEF1EA; --line:#D6DCD0;
  --sans:'IBM Plex Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--sans);word-break:keep-all}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
::selection{background:#FBE3A6;color:var(--ink)}

/* 상단·하단 바 (ugv2와 같은 틀) */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
.top img{height:26px}
.top h1{flex:1;margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.top nav{display:flex;gap:4px}
.top nav button{background:none;border:0;padding:6px 10px;border-radius:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.top nav button:hover,.top nav button[aria-pressed="true"]{color:var(--ink);background:var(--field)}
.bot{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--line);flex:none}
.bot button{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13.5px;cursor:pointer}
.bot button:hover{border-color:var(--olive)}
.bot button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.bot .ttl{font-size:13.5px;font-weight:700;margin-left:6px}
.bot .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#notes{flex:none;max-height:24vh;overflow:auto;border-top:1px solid var(--line);padding:14px 24px;line-height:1.7;font-size:15px;background:var(--field)}
#notes p{margin:0 0 6px;max-width:110ch}
#notes[hidden]{display:none}
body.full .top,body.full .bot,body.full #notes{display:none}

/* 무대: 16:9 슬라이드를 화면에 맞춤. 핫스팟(%)이 슬라이드와 겹치도록 상자 자체를 16:9로 */
#viewport{flex:1;position:relative;min-height:0;container-type:size}
hyperframes-slideshow{display:block;position:absolute;left:50%;top:50%;width:min(97cqw,172.44cqh);height:min(97cqh,54.56cqw);transform:translate(-50%,-50%);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);outline:none;--hf-slideshow-accent:var(--olive)}
body.full hyperframes-slideshow{width:min(100cqw,177.78cqh);height:min(100cqh,56.25cqw);border-radius:0;box-shadow:none}
hyperframes-player{position:absolute;inset:0}
hyperframes-slideshow:focus,hyperframes-slideshow:focus-visible{outline:none}
.progress{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
/* 슬라이드쇼 기본 조작 캡슐은 숨기고 아래 바로 대신함 */
hyperframes-slideshow [data-hf-nav-cluster]{display:none!important}
[data-hf-chrome]{container-type:size}

/* 부록 참조 핫스팟: 작은 번호 배지, 마우스를 올리면 '부록 N 참고' */
hyperframes-slideshow .hf-hotspot-pill{min-width:calc(.9cqw + .9cqw)!important;height:calc(.9cqw + .9cqw)!important;padding:0 .2cqw!important;gap:0!important;justify-content:center!important;border:.45cqw solid transparent!important;background-clip:padding-box!important;margin:-.45cqw 0 0 -.45cqw!important;border-radius:999px!important;background:var(--olive)!important;color:var(--olive-ink)!important;font-size:0!important;box-shadow:none!important;animation:none!important}
hyperframes-slideshow .hf-hotspot-pill>span{display:none!important}
hyperframes-slideshow .hf-hotspot-pill::before{content:attr(data-hotspot-id);font:600 .6cqw/1 var(--sans);color:var(--olive-ink)}
hyperframes-slideshow .hf-hotspot-pill::after{content:attr(aria-label);position:absolute;left:50%;bottom:calc(100% + .45cqw);transform:translateX(-50%);background:var(--ink);color:var(--olive-ink);font:500 .94cqw/1.3 var(--sans);padding:.38cqw .62cqw;border-radius:.25cqw;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
hyperframes-slideshow .hf-hotspot-pill:hover::after,hyperframes-slideshow .hf-hotspot-pill:focus-visible::after{opacity:1}
hyperframes-slideshow .hf-hotspot-pill:hover{background:var(--ink)!important}
hyperframes-slideshow .hf-hotspot-pill:focus-visible{outline:2px solid var(--signal)!important;outline-offset:1px}

/* 전체 보기 */
#list{display:none;position:fixed;inset:0;z-index:40;background:#fff;overflow:auto;padding:28px 40px 60px}
#list.on{display:block}
#list .close{position:sticky;top:0;float:right;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
#list h2{margin:0 0 16px;font-size:24px}
#list h3{margin:28px 0 12px;font-size:16px;color:var(--muted);font-weight:600}
#list ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
#list li button{width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font-size:15px;line-height:1.45}
#list li button:hover{border-color:var(--olive)}
#list li button b{display:block;color:#9A6B00;font-size:13px;margin-bottom:4px}
#play:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
/* ---------- 시작 화면 · 인트로 (ugv2 발표와 같은 흐름) ---------- */
#start{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s ease}
#start.out{opacity:0;pointer-events:none}
#start img{height:54px}
#play{width:120px;height:120px;border-radius:50%;border:none;background:var(--signal);cursor:pointer;position:relative;box-shadow:0 10px 30px rgba(242,169,0,.35);transition:transform .2s ease}
#play:hover{transform:scale(1.06)}
#play::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-38%,-50%);border-left:34px solid #fff;border-top:21px solid transparent;border-bottom:21px solid transparent}
#play::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--signal);opacity:.5;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.6}to{transform:scale(1.25);opacity:0}}
#start p{margin:0;color:var(--muted);font-size:15px;text-align:center;line-height:1.7}
#start p b{color:var(--ink);font-size:20px;display:block}
#intro{display:none;position:fixed;inset:0;z-index:50;background:#0d120e;color:#F3F5F1;overflow:hidden;cursor:pointer;transition:opacity .9s ease}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#icode{position:absolute;left:28px;top:24px;width:min(46vw,600px);font:12px/1.65 "JetBrains Mono","Nanum Gothic Coding",Consolas,monospace;color:#7fa77a;opacity:.85;white-space:pre;overflow:hidden;height:40vh;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#icode .k{color:var(--signal)} #icode .d{color:#566a58}
#ihud{position:absolute;right:28px;top:24px;font:12px/1.8 "JetBrains Mono","Nanum Gothic Coding",Consolas,monospace;color:#9fb59c;text-align:right}
#ihud b{color:var(--signal)} #ihud img{height:34px;display:block;margin-left:auto;margin-bottom:12px}
#ititle{position:absolute;left:6vw;bottom:16vh;max-width:88vw;text-shadow:0 2px 18px #0d120e}
#itg{font:700 13px "JetBrains Mono",Consolas,monospace;color:var(--signal);letter-spacing:.2em;margin-bottom:14px;opacity:0;transform:translateY(8px);transition:all .6s ease}
#itt{margin:0;font-weight:700;font-size:clamp(34px,6.2vw,86px);line-height:1.08;letter-spacing:-0.02em}
#itt span{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(6px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1),filter .5s ease}
#itt span.on,#itg.on,#isb.on{opacity:1;transform:none;filter:none}
#isb{margin-top:18px;font-size:clamp(15px,1.5vw,20px);color:#c9d1c5;opacity:0;transform:translateY(8px);transition:all .6s ease}
#ihint{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font:12px "JetBrains Mono",Consolas,monospace;color:#9fb59c;letter-spacing:.15em;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#play::before,#ihint{animation:none}}


</style>
</head>

<div id="start">

          "notes": "질문 대응 메모\n\nQ. 원래 2단계 계획(보안형 의사결정 지원 서버)은 버리나? 버리지 않습니다. 실전 단계가 그 계획의 연장선이고, 교육장 데이터가 그 모델을 먼저 키워 줍니다. 2단계 신청 방향은 경북창경 확인 후 정합니다."
        }
      ]
    },
    {
      "id": "seq-appM",
      "label": "부록 13. 아이디어 선정 과정",
      "slides": [
        {
          "sceneId": "appM",
          "notes": "질문 대응 메모\n\nQ. 드론 탐지는 왜 안 하나? 대드론 예산은 크지만 하드웨어 개발이 필요하고 1단계 자산을 덜 씁니다. 신속시범 수요신청서만 내보는 저비용 베팅으로는 따로 검토할 수 있습니다."
        }
      ]
    },
    {
      "id": "seq-appZ",
      "label": "출처 전체",
      "slides": [
        {
          "sceneId": "appZ",
          "notes": "질문 대응 메모\n\n수치 출처 질문이 나오면 이 장을 띄웁니다. 링크를 누르면 원문이 열립니다."
        }
      ]
    }
  ]
}
</script>

<div id="list" role="dialog" aria-label="슬라이드 목록"><button class="close" id="lClose" type="button">닫기 (Esc)</button><div id="lBody"></div></div>

<script>
(() => {
  const show = document.getElementById('show');
  const TITLES = {"s0": "표지", "toc": "목차", "s2": "A4AI 자산", "s3": "성능은 데이터가 결정한다", "s4": "군 음성 데이터는 만들어 써야 했다", "s5": "데이터를 만드는 제품", "s6": "훈련도 AI 평가로 간다", "s7": "제품 컨셉", "s8": "동작 방식", "s9": "정답을 우리가 쥔다", "s10": "K-방산 적합성 검증", "s12": "확장 경로", "s13": "실행 계획(안)", "appA": "부록 1. 용어·약어 사전", "appB": "부록 2. 1단계 과제 요약", "appC": "부록 3. 데이터 근거 상세", "appD": "부록 4. 군 음성 데이터 현황", "appE": "부록 5. 국방 AI·예산 동향", "appF": "부록 6. 시나리오 설계 틀(안)", "appG": "부록 7. 채점 기준(안)", "appH": "부록 8. 유사 사례", "appI": "부록 9. 무기체계 분류 근거", "appJ": "부록 10. 지원사업 창구 상세", "appK": "부록 11. 리스크 상세 대응표", "appL": "부록 12. 확장 경로 상세", "appM": "부록 13. 아이디어 선정 과정", "appZ": "출처 전체"};
  const MAINS = [{"id": "s0", "title": "표지"}, {"id": "toc", "title": "목차"}, {"id": "s2", "title": "A4AI 자산"}, {"id": "s3", "title": "성능은 데이터가 결정한다"}, {"id": "s4", "title": "군 음성 데이터는 만들어 써야 했다"}, {"id": "s5", "title": "데이터를 만드는 제품"}, {"id": "s6", "title": "훈련도 AI 평가로 간다"}, {"id": "s7", "title": "제품 컨셉"}, {"id": "s8", "title": "동작 방식"}, {"id": "s9", "title": "정답을 우리가 쥔다"}, {"id": "s10", "title": "K-방산 적합성 검증"}, {"id": "s12", "title": "확장 경로"}, {"id": "s13", "title": "실행 계획(안)"}];
  const APPS = [{"seq": "seq-appA", "id": "appA", "title": "부록 1. 용어·약어 사전"}, {"seq": "seq-appB", "id": "appB", "title": "부록 2. 1단계 과제 요약"}, {"seq": "seq-appC", "id": "appC", "title": "부록 3. 데이터 근거 상세"}, {"seq": "seq-appD", "id": "appD", "title": "부록 4. 군 음성 데이터 현황"}, {"seq": "seq-appE", "id": "appE", "title": "부록 5. 국방 AI·예산 동향"}, {"seq": "seq-appF", "id": "appF", "title": "부록 6. 시나리오 설계 틀(안)"}, {"seq": "seq-appG", "id": "appG", "title": "부록 7. 채점 기준(안)"}, {"seq": "seq-appH", "id": "appH", "title": "부록 8. 유사 사례"}, {"seq": "seq-appI", "id": "appI", "title": "부록 9. 무기체계 분류 근거"}, {"seq": "seq-appJ", "id": "appJ", "title": "부록 10. 지원사업 창구 상세"}, {"seq": "seq-appK", "id": "appK", "title": "부록 11. 리스크 상세 대응표"}, {"seq": "seq-appL", "id": "appL", "title": "부록 12. 확장 경로 상세"}, {"seq": "seq-appM", "id": "appM", "title": "부록 13. 아이디어 선정 과정"}, {"seq": "seq-appZ", "id": "appZ", "title": "출처 전체"}];
  const $ = id => document.getElementById(id);
  const ctl = () => show.controller; // 슬라이드쇼 컴포넌트의 컨트롤러(0.8.184 고정)

  /* ───── 하단 바·대본·진행 막대를 현재 위치에 맞춤 ───── */
  function update() {
    const c = ctl(); if (!c || !c.currentSlide) return;
    const inBranch = (c.breadcrumb || []).length > 1;
    const id = c.currentSlide.sceneId, n = c.counter;
    $('ttl').textContent = TITLES[id] || '';
    if (inBranch) {
      $('cnt').textContent = '부록';
      $('prev').textContent = '◀ 보던 장으로';
      $('next').textContent = '다음 ▶';
    } else {
      const i = MAINS.findIndex(m => m.id === id);
      $('cnt').textContent = (i + 1) + ' / ' + MAINS.length;
      $('prog').style.transform = 'scaleX(' + ((i + 1) / MAINS.length) + ')';
      $('prev').textContent = '◀ 이전';
      $('next').textContent = '다음 ▶';
    }
    const box = $('notes'); box.textContent = '';
    (c.currentSlide.notes || '').split(/\n\s*\n/).forEach(t => { const p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
  }
  let bound = null;
  function bind() {
    const c = ctl();
    if (c && c !== bound) { bound = c; c.onChange(update); update(); }
  }
  setInterval(bind, 400); // 컴포넌트가 준비되거나 다시 초기화되면 연결

  const next = () => ctl() && ctl().next();
  const prev = () => ctl() && ctl().prev();
  const goMain = i => { const c = ctl(); if (!c) return; if ((c.breadcrumb || []).length > 1 && c.backToMain) c.backToMain(); c.goToSlide && c.goToSlide(i); };
  $('prev').onclick = prev;
  $('next').onclick = next;

  function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  $('bF').onclick = toggleFull;
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('full', !!document.fullscreenElement));
  function toggleNotes() { const n = $('notes'); n.hidden = !n.hidden; $('bN').setAttribute('aria-pressed', String(!n.hidden)); }
  $('bN').onclick = toggleNotes;

  /* ───── 전체 보기 ───── */
  const list = $('list'), lBody = $('lBody');
  function openList() {
    lBody.innerHTML = '<h2>전체 슬라이드</h2><ol>' + MAINS.map((m, i) => `<li><button type="button" data-i="${i}"><b>${i + 1}</b>${m.title}</button></li>`).join('') + '</ol>'
      + '<h3>부록</h3><ol>' + APPS.map(a => `<li><button type="button" data-seq="${a.seq}"><b>${a.title.split('.')[0]}</b>${a.title.includes('.') ? a.title.slice(a.title.indexOf('.') + 1).trim() : a.title}</button></li>`).join('') + '</ol>';
    lBody.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { closeList(); goMain(+b.dataset.i); });
    lBody.querySelectorAll('button[data-seq]').forEach(b => b.onclick = () => { closeList(); const c = ctl(); if (!c) return; if ((c.breadcrumb || []).length > 1 && c.backToMain) c.backToMain(); c.enterBranch && c.enterBranch(b.dataset.seq); });
    list.classList.add('on'); $('lClose').focus();
  }
  function closeList() { list.classList.remove('on'); show.focus(); }
  $('bList').onclick = openList;
  $('lClose').onclick = closeList;

  /* ───── 시작 화면과 인트로 (ugv2 발표와 같은 흐름) ───── */
  const startEl = document.getElementById('start'), intro = document.getElementById('intro');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = false, introOn = false, t0 = 0;
  function playIntro() {
    started = true; startEl.classList.add('out'); setTimeout(() => startEl.style.display = 'none', 500);
    introOn = true; intro.style.display = 'block'; intro.classList.remove('out');
    resizeCv(); startTitle(); resetFlow(); t0 = performance.now(); requestAnimationFrame(frame);
  }
  function closeIntro() {
    introOn = false; intro.classList.add('out');
    setTimeout(() => { if (!introOn) intro.style.display = 'none'; }, 950);
    show.focus();
  }
  document.getElementById('play').onclick = playIntro;
  intro.addEventListener('click', closeIntro);
  document.getElementById('bIntro').onclick = playIntro;

  const TITLE = ['AI 무전 교관', '데이터를 만드는 제품'], itt = document.getElementById('itt');
  function startTitle() {
    itt.innerHTML = TITLE.map(l => [...l].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('')).join('<br>');
    ['itg', 'isb'].forEach(id => document.getElementById(id).classList.remove('on'));
    const sp = itt.querySelectorAll('span');
    setTimeout(() => document.getElementById('itg').classList.add('on'), 300);
    sp.forEach((s, i) => setTimeout(() => s.classList.add('on'), reduce ? 0 : 700 + i * 55));
    setTimeout(() => document.getElementById('isb').classList.add('on'), reduce ? 0 : 900 + sp.length * 55);
  }

  // 왼쪽 위 로그: 무전 한 줄이 채점되기까지 (연출용 예시)
  const icode = document.getElementById('icode');
  const LINES = ["<span class='k'>$</span> a4ai-radio-coach run --scenario 정찰보고 --role 상황실",
    "[INFO] tts     역할자=상황실  음질=무전기 대역  <span class='d'>합성 음성</span>",
    "[INFO] input   교육생 헤드셋 ch1  16kHz mono",
    "[INFO] stt     whisper  on-prem  lang=ko",
    "norm   '일사 이공'          → <span class='k'>14:20</span>",
    "norm   '찰리 호텔 일이삼사' → <span class='k'>CH 1234</span> …",
    "field  시간    = 14:20", "field  좌표    = CH 1234 5678", "field  표적명  = 적 보병 분대", "field  상황    = 북쪽으로 이동 중",
    "field  자산명  = <span class='k'>누락</span>",
    "score  필수 항목 4/5   복창 OK",
    "feedback → '자산 항목이 빠졌습니다'",
    "save   음성 + 정답 + 판정 → 통화단위 DB",
    "<span class='d'># 예시 출력: 연출용 로그이며 실제 측정값이 아님</span>"];
  let li = 0;
  function pushLine() { const d = document.createElement('div'); d.innerHTML = LINES[li++ % LINES.length]; icode.appendChild(d); if (icode.children.length > 40) icode.removeChild(icode.firstChild); }
  for (let i = 0; i < 6; i++) pushLine();
  setInterval(() => { if (introOn && !reduce) pushLine(); }, 420);

  // 캔버스: 오른쪽에서 들어온 무전 파형이 STT 헤드를 지나며 7필드 태그로 바뀜
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let Wd = 0, Ht = 0; const DPR = Math.min(devicePixelRatio || 1, 2);
  function resizeCv() { Wd = cv.clientWidth; Ht = cv.clientHeight; cv.width = Wd * DPR; cv.height = Ht * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', () => { if (introOn) resizeCv(); });
  const BW = 7, SPEED = 140, PERIOD = 96, KEYS = [14, 32, 50, 66], SEG = 9;
  const FIELDS = [['시간', '14:20'], ['좌표', 'CH 1234 5678'], ['표적명', '적 보병 분대'], ['상황', '북쪽으로 이동 중'], ['자산명', '누락']];
  const mod = k => ((k % PERIOD) + PERIOD) % PERIOD;
  const speech = k => { const m = mod(k); return m >= 8 && m < 80; };
  const isField = k => { const m = mod(k); return KEYS.some(s => m >= s && m < s + SEG); };
  let tags = [], lastK = null, utt = 0, lab = 0, fi = 0;
  function resetFlow() { tags = []; lastK = null; utt = 0; lab = 0; fi = 0; }
  const ease = p => 1 - Math.pow(1 - p, 3);
  function frame(ms) {
    const t = reduce ? 6 : Math.max(0, ms - t0) / 1000, W = Wd, H = Ht;
    ctx.globalAlpha = 1; ctx.fillStyle = '#0d120e'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(159,181,156,.07)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x < W; x += 64) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = 0; y < H; y += 64) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
    const cy = H * 0.42, amp = Math.min(H * 0.1, 88), headX = W * 0.6, off = t * SPEED;
    const kMax = Math.floor(off / BW), kMin = kMax - Math.ceil(W / BW) - 2;
    for (let k = kMin; k <= kMax; k++) {
      const x = W - (off - k * BW), sp = speech(k), read = x < headX;
      const a = sp ? 0.35 + 0.65 * Math.abs(Math.sin(k * 0.37) * Math.cos(k * 0.113)) : 0.05 + 0.05 * Math.abs(Math.sin(k * 1.7));
      const h = Math.max(2, a * amp);
      ctx.fillStyle = sp && isField(k) ? (read ? '#F2A900' : '#6d5a24') : sp ? (read ? '#7fa77a' : '#3d4a3f') : '#26302a';
      ctx.globalAlpha = Math.max(0, Math.min(1, (x - W * 0.2) / (W * 0.16))); // 왼쪽 로그·제목 쪽으로 갈수록 흐리게
      ctx.fillRect(x - 2, cy - h, 4, h * 2);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(242,169,0,.85)'; ctx.setLineDash([5, 5]); ctx.beginPath();
    ctx.moveTo(headX, cy - amp - 36); ctx.lineTo(headX, cy + amp + 36); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '700 12px "JetBrains Mono", monospace'; ctx.fillStyle = '#F2A900'; ctx.fillText('STT', headX + 8, cy + amp + 32);
    // 헤드를 지난 발화·필드 수 세기, 필드마다 태그 생성
    const kHead = Math.floor((off - (W - headX)) / BW);
    if (lastK === null) lastK = kHead;
    for (let k = lastK + 1; k <= kHead; k++) {
      const m = mod(k);
      if (m === 8) utt++;
      if (KEYS.includes(m)) { tags.push({ f: FIELDS[fi % FIELDS.length], lane: fi % 4, born: t }); fi++; lab++; }
    }
    lastK = kHead;
    tags = tags.filter(g => t - g.born < 2.8);
    tags.forEach(g => {
      const p = (t - g.born) / 2.8, e = ease(Math.min(1, p / 0.7));
      const miss = g.f[1] === '누락';
      ctx.font = '600 15px "IBM Plex Sans KR", sans-serif'; const w1 = ctx.measureText(g.f[0]).width;
      ctx.font = '500 15px "JetBrains Mono", "Nanum Gothic Coding", monospace'; const w2 = ctx.measureText(g.f[1]).width;
      const w = w1 + w2 + 38;
      const x = headX - 18 - w - e * 30, y = cy - amp - 50 - e * (16 + g.lane * 40); // STT 헤드 왼쪽 위로 쌓임
      ctx.globalAlpha = p < 0.12 ? p / 0.12 : p > 0.78 ? (1 - p) / 0.22 : 1;
      if (p < 0.35) { ctx.strokeStyle = 'rgba(242,169,0,.5)'; ctx.beginPath(); ctx.moveTo(headX, cy - amp); ctx.lineTo(x + w - 10, y + 15); ctx.stroke(); }
      ctx.fillStyle = 'rgba(13,18,14,.9)'; ctx.strokeStyle = miss ? '#D06A55' : '#F2A900'; ctx.lineWidth = 1.5;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, 30, 4); else ctx.rect(x, y, w, 30); ctx.fill(); ctx.stroke();
      ctx.font = '600 15px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle = '#9fb59c'; ctx.fillText(g.f[0], x + 12, y + 20);
      ctx.font = '500 15px "JetBrains Mono", "Nanum Gothic Coding", monospace'; ctx.fillStyle = miss ? '#E08A7A' : '#F3F5F1'; ctx.fillText(g.f[1], x + 24 + w1, y + 20);
    });
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
    const v = ctx.createRadialGradient(W * 0.56, H * 0.55, H * 0.25, W * 0.56, H * 0.55, H * 1.05);
    v.addColorStop(0, 'rgba(13,18,14,0)'); v.addColorStop(1, 'rgba(13,18,14,.75)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    document.getElementById('iutt').textContent = utt; document.getElementById('ilab').textContent = lab;
    if (!reduce && intro.style.display !== 'none') requestAnimationFrame(frame);
  }


  /* ───── 키보드: 시작 화면·인트로·목록이 우선, 그다음 슬라이드 이동 ───── */
  window.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key, stop = () => { e.preventDefault(); e.stopImmediatePropagation(); };
    if (!started) { if (k === 'Enter' || k === ' ') { stop(); playIntro(); } else e.stopImmediatePropagation(); return; }
    if (introOn) { stop(); closeIntro(); return; }
    if (list.classList.contains('on')) { if (k === 'Escape') { stop(); closeList(); } return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { stop(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { stop(); prev(); }
    else if (k === 'Home') { stop(); goMain(0); }
    else if (k === 'End') { stop(); goMain(MAINS.length - 1); }
    else if (k === 'f' || k === 'F') { stop(); toggleFull(); }
    else if (k === 'n' || k === 'N') { stop(); toggleNotes(); }
    else if (k === 'p' || k === 'P') stop(); // 이 화면 틀에서는 대본 패널을 쓰므로 별도 발표자 창은 열지 않음
  }, true);
})();
</script>
